name: self-healing-pipeline

services:
  # --- Broker -----------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092" # internal / inter-container listener
      - "29092:29092" # host-facing listener, for tools running outside docker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # --- Observability ------------------------------------------------------
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # --- Producer -------------------------------------------------------
  # Replays partitioned CSV tables as live feeds into Kafka.
  producer:
    build: ./producer
    container_name: producer
    volumes:
      - ./data:/data:ro
    environment:
      DATA_DIR: /data
      TABLES: Crash1,Crash2,Crash3
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PREFIX: crashes
      TOPIC_PER_TABLE: "true"
      BATCH_SIZE: "50"
      BATCH_INTERVAL_SECONDS: "3"
      LOOP_FOREVER: "false"
      STREAMING_MODE: "interleaved"
    depends_on:
      kafka:
        condition: service_healthy

  # --- Bronze -------------------------------------------------------
  # Kafka -> Delta, untouched raw landing.
  bronze-job:
    build: ./spark-jobs
    container_name: bronze-job
    command: [ "python", "bronze_job.py" ]
    restart: on-failure
    volumes:
      - ./spark-jobs:/app
      - ./delta:/data/delta
      - ./checkpoints:/data/checkpoints
      - ivy-cache:/root/.ivy2
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPICS: crashes.crash1,crashes.crash2,crashes.crash3
      DELTA_TABLE_PATH: /data/delta/bronze
      CHECKPOINT_PATH: /data/checkpoints/bronze
    depends_on:
      kafka:
        condition: service_healthy

  # --- Silver 1 -----------------------------------------------------
  # Bronze -> parsed/cleaned via SILVER1_TRANSFORM_SQL.
  silver1-job:
    build: ./spark-jobs
    container_name: silver1-job
    command: [ "python", "silver1_job.py" ]
    restart: on-failure
    volumes:
      - ./spark-jobs:/app
      - ./delta:/data/delta
      - ./checkpoints:/data/checkpoints
      - ivy-cache:/root/.ivy2
    environment:
      BRONZE_PATH: /data/delta/bronze
      SILVER1_PATH: /data/delta/silver1
      CHECKPOINT_PATH: /data/checkpoints/silver1
    depends_on:
      bronze-job:
        condition: service_started

  # --- Silver 2 -----------------------------------------------------
  # Silver 1 -> standardized via PySpark canonical lookups & parsing chains.
  silver2-job:
    build: ./spark-jobs
    container_name: silver2-job
    command: [ "python", "silver2_job.py" ]
    restart: on-failure
    volumes:
      - ./spark-jobs:/app
      - ./delta:/data/delta
      - ./checkpoints:/data/checkpoints
      - ivy-cache:/root/.ivy2
    environment:
      SILVER1_PATH: /data/delta/silver1
      SILVER2_PATH: /data/delta/silver2
      CHECKPOINT_PATH: /data/checkpoints/silver2
      QUARANTINE_PATH: /data/delta/silver2_quarantine
      DEAD_LETTER_PATH: /data/delta/silver2_dead_letter
      REF_MAPPINGS_PATH: /data/delta/ref_canonical_mappings
      FUZZY_AUDIT_PATH: /data/delta/silver2_fuzzy_audit
    depends_on:
      silver1-job:
        condition: service_started

  # --- Gold -------------------------------------------------------
  # Silver 2 -> business-ready fields via GOLD_TRANSFORM_SQL.
  gold-job:
    build: ./spark-jobs
    container_name: gold-job
    command: [ "python", "gold_job.py" ]
    restart: on-failure
    volumes:
      - ./spark-jobs:/app
      - ./delta:/data/delta
      - ./checkpoints:/data/checkpoints
      - ivy-cache:/root/.ivy2
    environment:
      SILVER2_PATH: /data/delta/silver2
      GOLD_PATH: /data/delta/gold
      CHECKPOINT_PATH: /data/checkpoints/gold
    depends_on:
      silver2-job:
        condition: service_started

volumes:
  ivy-cache:
