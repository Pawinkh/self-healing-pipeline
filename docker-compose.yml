name: self-healing-pipeline

services:
  # --- Broker -----------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092" # internal / inter-container listener
      - "29092:29092" # host-facing listener, for tools running outside docker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # --- Observability ------------------------------------------------------
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # --- Producer -------------------------------------------------------
  # Replays partitioned CSV tables as live feeds into Kafka.
  producer:
    build: ./producer
    container_name: producer
    volumes:
      - ./data:/data:ro
    environment:
      DATA_DIR: /data
      TABLES: Crash1,Crash2,Crash3
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PREFIX: crashes
      TOPIC_PER_TABLE: "true"
      BATCH_SIZE: "50"
      BATCH_INTERVAL_SECONDS: "3"
      LOOP_FOREVER: "false"
      STREAMING_MODE: "interleaved"
    depends_on:
      kafka:
        condition: service_healthy

  # --- Bronze + Silver 1 -------------------------------------------
  # One Spark driver, two streaming queries:
  #   Kafka -> Delta, untouched raw landing (bronze)
  #   Bronze -> parsed/cleaned via SILVER1_TRANSFORM_SQL (silver1)
  bronze-silver1-job:
    build: ./spark-jobs
    container_name: bronze-silver1-job
    command: [ "python", "run_layers.py", "bronze", "silver1" ]
    restart: on-failure
    volumes:
      - ./spark-jobs:/app
      - ./qwen_classifier:/app/qwen_classifier:ro
      - ./incidents:/data/incidents
      - ./delta:/data/delta
      - ./checkpoints:/data/checkpoints
      - ivy-cache:/root/.ivy2
    environment:
      QWEN_ENABLED: ${QWEN_ENABLED:-false}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-http://host.docker.internal:11434}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3:4b-instruct}
      QWEN_INCIDENT_DIR: /data/incidents
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPICS: crashes.crash1,crashes.crash2,crashes.crash3
      OPENLINEAGE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENLINEAGE_TOPIC: openlineage.events
      BRONZE_PATH: /data/delta/bronze
      BRONZE_CHECKPOINT_PATH: /data/checkpoints/bronze
      SILVER1_PATH: /data/delta/silver1
      SILVER1_CHECKPOINT_PATH: /data/checkpoints/silver1
    depends_on:
      kafka:
        condition: service_healthy

  # --- Silver 2 + Gold ----------------------------------------------
  # One Spark driver, two streaming queries:
  #   Silver 1 -> standardized via canonical lookups & parsing chains (silver2)
  #   Silver 2 -> business-ready fields via GOLD_TRANSFORM_SQL (gold)
  silver2-gold-job:
    build: ./spark-jobs
    container_name: silver2-gold-job
    command: [ "python", "run_layers.py", "silver2", "gold" ]
    restart: on-failure
    volumes:
      - ./spark-jobs:/app
      - ./qwen_classifier:/app/qwen_classifier:ro
      - ./incidents:/data/incidents
      - ./delta:/data/delta
      - ./checkpoints:/data/checkpoints
      - ivy-cache:/root/.ivy2
    environment:
      QWEN_ENABLED: ${QWEN_ENABLED:-false}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-http://host.docker.internal:11434}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3:4b-instruct}
      QWEN_INCIDENT_DIR: /data/incidents
      SILVER1_PATH: /data/delta/silver1
      SILVER2_PATH: /data/delta/silver2
      SILVER2_CHECKPOINT_PATH: /data/checkpoints/silver2
      QUARANTINE_PATH: /data/delta/silver2_quarantine
      DEAD_LETTER_PATH: /data/delta/silver2_dead_letter
      REF_MAPPINGS_PATH: /data/delta/ref_canonical_mappings
      FUZZY_AUDIT_PATH: /data/delta/silver2_fuzzy_audit
      GOLD_PATH: /data/delta/gold
      GOLD_CHECKPOINT_PATH: /data/checkpoints/gold
      OPENLINEAGE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENLINEAGE_TOPIC: openlineage.events
    depends_on:
      bronze-silver1-job:
        condition: service_started
      kafka:
        condition: service_healthy

  # --- Knowledge graph -----------------------------------------------
  # Lineage metadata (OpenLineage) and the incident corpus (vector index).
  # Browser: http://localhost:7474   Bolt: bolt://localhost:7687
  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j
    ports:
      - "7474:7474" # HTTP browser
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-selfhealing}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-selfhealing}' 'RETURN 1' || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # One-shot: applies lineage/schema.cypher (idempotent) and exits.
  neo4j-init:
    image: neo4j:5.26-community
    container_name: neo4j-init
    restart: "no"
    entrypoint: [ "sh", "-c", "cypher-shell -a bolt://neo4j:7687 -u neo4j -p '${NEO4J_PASSWORD:-selfhealing}' -f /schema/schema.cypher" ]
    volumes:
      - ./lineage/schema.cypher:/schema/schema.cypher:ro
    depends_on:
      neo4j:
        condition: service_healthy

  # Reads the OpenLineage events the Spark jobs publish to Kafka and writes the
  # pipeline lineage graph (jobs, runs, tables, schema versions) into Neo4j.
  lineage-consumer:
    build: ./lineage
    container_name: lineage-consumer
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENLINEAGE_TOPIC: openlineage.events
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-selfhealing}
    depends_on:
      kafka:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully

volumes:
  ivy-cache:
  neo4j-data:
  neo4j-logs:
